[tool.poetry]
name = "documind-rag"
version = "1.0.0"
description = "Mini-projeto acadêmico de Chatbot RAG (Retrieval Augmented Generation) com IA Generativa."
authors = ["Desenvolvedor AI-Augmented <estudante@example.com>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.1"}
pydantic = "^2.6.1"
google-genai = "^0.1.1"
tiktoken = "^0.6.0"
numpy = "^1.26.4"
pytest = "^8.0.2"
python-dotenv = "^1.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
